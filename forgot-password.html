<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password — Kraken Guard</title>
<meta name="description" content="Reset your Kraken Guard account password.">
<style>
  :root {
    --bg: #0a2e2e;
    --surface: #0f3d3d;
    --border: #1c4f4f;
    --heading: #00e5cc;
    --heading-dim: #00a691;
    --text: rgba(255,255,255,0.92);
    --text-body: rgba(255,255,255,0.87);
    --muted: #8fb8b3;
    --focus: #00e5cc;
    --success: #3ecf8e;
    --danger: #ff4f6a;
    --font-sans: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --font-mono: "Cascadia Code", "SF Mono", Consolas, "Liberation Mono", monospace;
    --radius: 10px;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text-body);
    font-family: var(--font-sans);
    font-size: clamp(15px, 1.5vw, 17px);
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }

  a { color: var(--heading); text-decoration-color: var(--heading-dim); text-underline-offset: 2px; }
  a:hover { text-decoration-color: var(--heading); }
  a:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 3px; }

  .site-header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 2.5rem 1.5rem 2rem;
  }

  .header-inner {
    max-width: 420px;
    margin: 0 auto;
    display: flex;
    align-items: flex-start;
    gap: 1rem;
  }

  .mark { flex-shrink: 0; width: 40px; height: 40px; margin-top: 0.2rem; }

  .header-text h1 {
    margin: 0 0 0.35rem;
    font-size: clamp(1.3rem, 4vw, 1.6rem);
    font-weight: 700;
    letter-spacing: -0.01em;
    color: var(--heading);
    text-wrap: balance;
  }

  .header-text p {
    margin: 0;
    font-size: 0.9rem;
    color: var(--muted);
  }

  main {
    max-width: 420px;
    margin: 0 auto;
    padding: 2.5rem 1.5rem 4rem;
  }

  .form-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.75rem 1.5rem;
  }

  .field { margin-bottom: 1.1rem; }
  .field label {
    display: block;
    font-size: 0.78rem;
    font-weight: 700;
    color: var(--muted);
    margin-bottom: 0.4rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .field input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    padding: 0.65rem 0.75rem;
    font-size: 0.95rem;
    font-family: var(--font-sans);
    outline: none;
    transition: border-color 0.15s;
  }
  .field input:focus { border-color: var(--heading); }

  .btn-primary {
    width: 100%;
    background: var(--heading);
    color: var(--bg);
    border: none;
    border-radius: 6px;
    padding: 0.75rem 1rem;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
    transition: opacity 0.15s;
    font-family: var(--font-sans);
  }
  .btn-primary:hover { opacity: 0.9; }
  .btn-primary:disabled { opacity: 0.5; cursor: default; }

  .form-message {
    margin-top: 1.1rem;
    padding: 0.75rem 1rem;
    border-radius: 6px;
    font-size: 0.88rem;
    line-height: 1.5;
    display: none;
  }
  .form-message.show { display: block; }
  .form-message.success { background: rgba(62,207,142,0.12); border: 1px solid var(--success); color: var(--success); }
  .form-message.error { background: rgba(255,79,106,0.12); border: 1px solid var(--danger); color: var(--danger); }

  .back-link { display: block; margin-top: 1.5rem; text-align: center; font-size: 0.88rem; color: var(--muted); text-decoration: none; }
  .back-link:hover { color: var(--heading); }

  footer {
    max-width: 420px;
    margin: 0 auto;
    padding: 0 1.5rem 3rem;
    color: var(--muted);
    font-size: 0.82rem;
    text-align: center;
  }
  footer a { color: var(--muted); }
</style>
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <svg class="mark" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M20 4 L34 11 V21 C34 29 28 35 20 37 C12 35 6 29 6 21 V11 Z"
            stroke="#00e5cc" stroke-width="2" stroke-linejoin="round"/>
      <path d="M14 19 L18 23 L26 15" stroke="#00e5cc" stroke-width="2.2"
            stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <div class="header-text">
      <h1>Forgot your password?</h1>
      <p>Enter your account email and we'll send you a reset link.</p>
    </div>
  </div>
</header>

<main>
  <div class="form-card">
    <form id="forgotForm" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="email">
      </div>
      <button type="submit" class="btn-primary" id="submitBtn">Send reset link</button>
    </form>
    <div class="form-message" id="formMessage"></div>
  </div>

  <a class="back-link" href="https://krakenguardextension.github.io/krakenguard-privacy/">← Back to Privacy Policy</a>
</main>

<footer>
  <p>Kraken Guard · <a href="terms.html">Terms and Conditions</a> · <a href="index.html">Privacy Policy</a></p>
</footer>

<script>
  const API_BASE = 'https://krakenguard-backend-production.up.railway.app/api';
  const form = document.getElementById('forgotForm');
  const btn = document.getElementById('submitBtn');
  const message = document.getElementById('formMessage');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    if (!email) return;

    btn.disabled = true;
    btn.textContent = 'Sending…';
    message.className = 'form-message';

    try {
      const res = await fetch(`${API_BASE}/auth/forgot-password`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email })
      });
      const data = await res.json().catch(() => ({}));

      if (res.ok) {
        message.textContent = data.message || "If that email has an account, we've sent a reset link.";
        message.classList.add('show', 'success');
        form.reset();
      } else {
        message.textContent = data.error || 'Something went wrong. Please try again.';
        message.classList.add('show', 'error');
      }
    } catch (err) {
      message.textContent = 'Could not reach the server. Please check your connection and try again.';
      message.classList.add('show', 'error');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Send reset link';
    }
  });
</script>

</body>
</html>
