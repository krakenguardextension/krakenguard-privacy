<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — Kraken Guard</title>
<meta name="description" content="Choose a new password for your Kraken Guard account.">
<style>
  :root {
    --bg: #0a2e2e;
    --surface: #0f3d3d;
    --border: #1c4f4f;
    --heading: #00e5cc;
    --heading-dim: #00a691;
    --text: rgba(255,255,255,0.92);
    --text-body: rgba(255,255,255,0.87);
    --muted: #8fb8b3;
    --focus: #00e5cc;
    --success: #3ecf8e;
    --danger: #ff4f6a;
    --font-sans: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --font-mono: "Cascadia Code", "SF Mono", Consolas, "Liberation Mono", monospace;
    --radius: 10px;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text-body);
    font-family: var(--font-sans);
    font-size: clamp(15px, 1.5vw, 17px);
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }

  a { color: var(--heading); text-decoration-color: var(--heading-dim); text-underline-offset: 2px; }
  a:hover { text-decoration-color: var(--heading); }
  a:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 3px; }

  .site-header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 2.5rem 1.5rem 2rem;
  }

  .header-inner {
    max-width: 420px;
    margin: 0 auto;
    display: flex;
    align-items: flex-start;
    gap: 1rem;
  }

  .mark { flex-shrink: 0; width: 40px; height: 40px; margin-top: 0.2rem; }

  .header-text h1 {
    margin: 0 0 0.35rem;
    font-size: clamp(1.3rem, 4vw, 1.6rem);
    font-weight: 700;
    letter-spacing: -0.01em;
    color: var(--heading);
    text-wrap: balance;
  }

  .header-text p {
    margin: 0;
    font-size: 0.9rem;
    color: var(--muted);
  }

  main {
    max-width: 420px;
    margin: 0 auto;
    padding: 2.5rem 1.5rem 4rem;
  }

  .form-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.75rem 1.5rem;
  }

  .field { margin-bottom: 1.1rem; }
  .field label {
    display: block;
    font-size: 0.78rem;
    font-weight: 700;
    color: var(--muted);
    margin-bottom: 0.4rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .field input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    padding: 0.65rem 0.75rem;
    font-size: 0.95rem;
    font-family: var(--font-sans);
    outline: none;
    transition: border-color 0.15s;
  }
  .field input:focus { border-color: var(--heading); }
  .field .hint { margin: 0.35rem 0 0; font-size: 0.78rem; color: var(--muted); }

  .btn-primary {
    width: 100%;
    background: var(--heading);
    color: var(--bg);
    border: none;
    border-radius: 6px;
    padding: 0.75rem 1rem;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
    transition: opacity 0.15s;
    font-family: var(--font-sans);
  }
  .btn-primary:hover { opacity: 0.9; }
  .btn-primary:disabled { opacity: 0.5; cursor: default; }

  .form-message {
    margin-top: 1.1rem;
    padding: 0.75rem 1rem;
    border-radius: 6px;
    font-size: 0.88rem;
    line-height: 1.5;
    display: none;
  }
  .form-message.show { display: block; }
  .form-message.success { background: rgba(62,207,142,0.12); border: 1px solid var(--success); color: var(--success); }
  .form-message.error { background: rgba(255,79,106,0.12); border: 1px solid var(--danger); color: var(--danger); }

  .back-link { display: block; margin-top: 1.5rem; text-align: center; font-size: 0.88rem; color: var(--muted); text-decoration: none; }
  .back-link:hover { color: var(--heading); }

  footer {
    max-width: 420px;
    margin: 0 auto;
    padding: 0 1.5rem 3rem;
    color: var(--muted);
    font-size: 0.82rem;
    text-align: center;
  }
  footer a { color: var(--muted); }
</style>
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <svg class="mark" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M20 4 L34 11 V21 C34 29 28 35 20 37 C12 35 6 29 6 21 V11 Z"
            stroke="#00e5cc" stroke-width="2" stroke-linejoin="round"/>
      <path d="M14 19 L18 23 L26 15" stroke="#00e5cc" stroke-width="2.2"
            stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <div class="header-text">
      <h1>Choose a new password</h1>
      <p id="subhead">Enter a new password for your Kraken Guard account.</p>
    </div>
  </div>
</header>

<main>
  <div class="form-card">
    <form id="resetForm" novalidate>
      <div class="field">
        <label for="password">New password</label>
        <input type="password" id="password" name="password" placeholder="At least 8 characters" required autocomplete="new-password">
      </div>
      <div class="field">
        <label for="confirmPassword">Confirm new password</label>
        <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Re-enter your new password" required autocomplete="new-password">
      </div>
      <button type="submit" class="btn-primary" id="submitBtn">Reset password</button>
    </form>

    <div id="noTokenState" style="display:none">
      <p style="margin:0 0 1rem">This reset link is missing its token, so it can't be used. Please request a new one from the Forgot Password page.</p>
      <a class="back-link" style="margin-top:0" href="forgot-password.html">Request a new reset link →</a>
    </div>

    <div class="form-message" id="formMessage"></div>
  </div>

  <a class="back-link" href="https://krakenguardextension.github.io/krakenguard-privacy/">← Back to Privacy Policy</a>
</main>

<footer>
  <p>Kraken Guard · <a href="terms.html">Terms and Conditions</a> · <a href="index.html">Privacy Policy</a></p>
</footer>

<script>
  const API_BASE = 'https://krakenguard-backend-production.up.railway.app/api';
  const params = new URLSearchParams(window.location.search);
  const token = params.get('token');

  const form = document.getElementById('resetForm');
  const btn = document.getElementById('submitBtn');
  const message = document.getElementById('formMessage');
  const noTokenState = document.getElementById('noTokenState');
  const subhead = document.getElementById('subhead');

  if (!token) {
    form.style.display = 'none';
    noTokenState.style.display = 'block';
    subhead.textContent = 'This reset link is invalid.';
  } else {
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      message.className = 'form-message';

      if (password.length < 8) {
        message.textContent = 'Password must be at least 8 characters.';
        message.classList.add('show', 'error');
        return;
      }
      if (password !== confirmPassword) {
        message.textContent = 'Passwords do not match.';
        message.classList.add('show', 'error');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Resetting…';

      try {
        const res = await fetch(`${API_BASE}/auth/reset-password`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, password })
        });
        const data = await res.json().catch(() => ({}));

        if (res.ok) {
          message.textContent = 'Your password has been reset. You can now sign in from the Kraken Guard extension.';
          message.classList.add('show', 'success');
          form.style.display = 'none';
        } else {
          message.textContent = data.error || 'Something went wrong. Please try again.';
          message.classList.add('show', 'error');
          btn.disabled = false;
          btn.textContent = 'Reset password';
        }
      } catch (err) {
        message.textContent = 'Could not reach the server. Please check your connection and try again.';
        message.classList.add('show', 'error');
        btn.disabled = false;
        btn.textContent = 'Reset password';
      }
    });
  }
</script>

</body>
</html>
